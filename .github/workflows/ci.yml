name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # matches the python:3.12-slim runtime image
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend deps + formatters
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
          # clang-format isn't in requirements (the Dockerfile installs it
          # separately); the test harness picks it up from the venv.
          backend/.venv/bin/python -m pip install clang-format==18.1.8

      - name: Install the classic-language formatters
        # so the classic + version-axis tests actually run (not skip). Go, Rust
        # (rustfmt) and Java come preinstalled on the runner; add the rest.
        run: |
          set -eux
          npm install -g prettier@3 @taplo/cli@0.7
          sudo curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt
          sudo curl -fsSL -o /usr/local/lib/google-java-format.jar \
            https://github.com/google/google-java-format/releases/download/v1.25.2/google-java-format-1.25.2-all-deps.jar
          printf '%s\n' '#!/bin/sh' \
            'exec java --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED -jar /usr/local/lib/google-java-format.jar "$@"' \
            | sudo tee /usr/local/bin/google-java-format > /dev/null
          sudo chmod +x /usr/local/bin/google-java-format
          gofmt --help >/dev/null 2>&1 || true; rustfmt --version; prettier --version; shfmt --version; google-java-format --version || true

      - name: Run pytest
        working-directory: backend
        run: .venv/bin/python -m pytest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # matches the node:22-alpine build image
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Type-check + build (tsc -b && vite build)
        run: npm run build
        working-directory: app

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image end-to-end
        run: docker build -t format-quorum:ci .
