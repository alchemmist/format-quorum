name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          # the image now builds a full toolchain (JDK, Go, Rust, Node, formatters);
          # the first cold build blows past the 10m default. Subsequent deploys hit
          # the host's docker layer cache and finish in a few minutes.
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP_DIR=/opt/format-quorum
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/alchemmist/format-quorum.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
