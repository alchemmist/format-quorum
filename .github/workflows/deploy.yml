name: Deploy to laba

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to laba over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP_DIR=/home/www/format-quorum
            REPO=https://github.com/alchemmist/format-quorum.git

            # The first manual deployment may already have populated APP_DIR
            # without a .git directory. Attach git to that directory in place;
            # Docker volumes are independent and remain untouched.
            mkdir -p "$APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" init
              git -C "$APP_DIR" remote add origin "$REPO"
            fi
            git -C "$APP_DIR" fetch --depth=1 origin main
            git -C "$APP_DIR" reset --hard FETCH_HEAD

            cd "$APP_DIR"
            FORMAT_QUORUM_PORT=30001 docker compose up -d --build --force-recreate
            docker image prune -f
