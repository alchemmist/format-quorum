# Production deployment: the app behind Caddy (automatic HTTPS) on
# fq.alchemmist.xyz. Run on the server from the repo root:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires a DNS A record fq.alchemmist.xyz -> <server ip> and ports 80/443 open.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # override to a reachable mirror if static.rust-lang.org is blocked on the
      # build host (the image is built here over SSH during deploy)
      args:
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://static.rust-lang.org/rustup}
    image: format-quorum:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      FRONTEND_DIST: /app/frontend
      # SECURITY: this opens custom-binary uploads on a PUBLIC, auth-less instance
      # — anyone can upload and run an arbitrary executable server-side (RCE).
      # Deliberately accepted for now; tracked for hardening (auth/token). See #18.
      ALLOW_BINARY_UPLOAD: "1"
      CLANG_FORMAT_BIN: /usr/local/bin/clang-format
      CLANG_FORMAT_CONFIG: /app/configs/clang-format
      RUFF_BIN: ruff
      RUFF_CONFIG: /app/configs/ruff.toml
      VERSIONS_DIR: /app/clang_versions
      TESTS_DIR: /app/tests
      CONFIG_HISTORY_DIR: /app/config_history
    volumes:
      # installed clang-format versions persist across deploys
      - clang_versions:/app/clang_versions
      # tests live in a named volume so UI edits on prod survive deploys
      # (git reset --hard never touches it). The image seeds it once when empty.
      - tests_data:/app/tests
      # config history (base + published patches) persists so a deploy can't lose
      # the live config or the ability to roll it back. The git-backed configs
      # below only seed the *base*; the current version is re-materialized from
      # this volume on every start.
      - config_data:/app/config_history
      # configs are git-backed (the canonical team base config is the repo); the
      # current published version is materialized over them from the volume above
      - ./backend/configs:/app/configs
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  clang_versions:
  tests_data:
  config_data:
  caddy_data:
  caddy_config:
