services:
  app:
    # Production formatter binaries (including cf-my-patch) are x86_64.
    # Keep the local image on the same ABI when running on Apple Silicon.
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      # override to a reachable mirror if static.rust-lang.org is blocked on the
      # build network: RUSTUP_DIST_SERVER=… RUSTUP_UPDATE_ROOT=…/rustup make run
      args:
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://static.rust-lang.org/rustup}
    image: format-quorum:latest
    container_name: format-quorum
    restart: unless-stopped
    ports:
      - "${FORMAT_QUORUM_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      FRONTEND_DIST: /app/frontend
      CLANG_FORMAT_BIN: /usr/local/bin/clang-format
      CLANG_FORMAT_CONFIG: /app/configs/clang-format
      RUFF_BIN: ruff
      RUFF_CONFIG: /app/configs/ruff.toml
      VERSIONS_DIR: /app/clang_versions
      TESTS_DIR: /app/tests
      CONFIG_HISTORY_DIR: /app/config_history
    volumes:
      # persist dynamically-installed clang-format versions across restarts
      - local_clang_versions:/app/clang_versions
      # restore the current production tests, including UI edits
      - local_tests_data:/app/tests
      # restore published configs, history, shadows and custom formatter metadata
      - local_config_data:/app/config_history
      # configs are git-backed too: editing them in the UI writes to the repo
      - ./backend/configs:/app/configs

volumes:
  local_clang_versions:
    name: format-quorum-local_clang_versions
  local_tests_data:
    name: format-quorum-local_tests_data
  local_config_data:
    name: format-quorum-local_config_data
