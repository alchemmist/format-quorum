services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: format-quorum:latest
    container_name: format-quorum
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      CLANG_FORMAT_BIN: /usr/local/bin/clang-format
      CLANG_FORMAT_CONFIG: /app/dist/clang-format
      RUFF_BIN: ruff
      RUFF_CONFIG: /app/dist/ruff.toml
