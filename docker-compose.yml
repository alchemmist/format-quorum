services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # override to a reachable mirror if static.rust-lang.org is blocked on the
      # build network: RUSTUP_DIST_SERVER=… RUSTUP_UPDATE_ROOT=…/rustup make run
      args:
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://static.rust-lang.org/rustup}
    image: format-quorum:latest
    container_name: format-quorum
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      FRONTEND_DIST: /app/frontend
      CLANG_FORMAT_BIN: /usr/local/bin/clang-format
      CLANG_FORMAT_CONFIG: /app/configs/clang-format
      RUFF_BIN: ruff
      RUFF_CONFIG: /app/configs/ruff.toml
      VERSIONS_DIR: /app/clang_versions
      TESTS_DIR: /app/tests
    volumes:
      # persist dynamically-installed clang-format versions across restarts
      - clang_versions:/app/clang_versions
      # tests are git-backed: bind-mount the repo dir so UI edits land in git
      - ./backend/tests:/app/tests
      # configs are git-backed too: editing them in the UI writes to the repo
      - ./backend/configs:/app/configs

volumes:
  clang_versions:
